# F3 (repo 2): declares wf-race exactly as the CLI created it, so Blueprint 2's
# only action is a capture. repo/branch pinned to workflows-demo for the same
# reason as fixture 16: otherwise the plan also wants to repoint build config.
services:
  - type: workflow
    name: wf-race
    runtime: node
    repo: https://github.com/jmtuley/workflows-demo
    branch: master
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: commit
