name: Feathered Friends comforters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch genuine Shopify endpoints and report all 16 King variants
        run: python3 comforter-checker/check.py
      - name: Save responses and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comforter-results
          path: comforter-results/
          if-no-files-found: ignore
          retention-days: 30
